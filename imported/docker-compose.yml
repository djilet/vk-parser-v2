version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "3001:3001"
      - "6080:6080" # noVNC web interface for browser interaction
    volumes:
      # Mount browser profiles and tokens so they persist across container restarts
      - ./.browser-profile-1:/app/.browser-profile-1
      - ./.browser-profile-2:/app/.browser-profile-2
      - ./tokens:/app/tokens
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Если на хосте есть GPU от NVIDIA, раскомментируйте блок ниже для ускорения работы нейросети:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama_data:
